name: signal-prod

services:
  db:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-signal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-signal}
      NO_TS_TUNE: "true"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - internal

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    image: signal-api:${SIGNAL_IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-signal}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-signal}
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
      SCHEDULER_TIMEZONE: ${SCHEDULER_TIMEZONE:-Asia/Shanghai}
      SCHEDULER_CRON_HOUR: ${SCHEDULER_CRON_HOUR:-17}
      SCHEDULER_CRON_MINUTE: ${SCHEDULER_CRON_MINUTE:-30}
      API_TOKEN: ${API_TOKEN:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      RUNNER_CALLBACK_SECRET: ${RUNNER_CALLBACK_SECRET:?set RUNNER_CALLBACK_SECRET}
      RESEARCH_CALLBACK_HOST: ${RESEARCH_CALLBACK_HOST:-http://api:8000}
      RESEARCH_ARTIFACTS_DIR: /var/lib/signal/artifacts
      RESEARCH_DATA_SNAPSHOTS_DIR: ${RESEARCH_DATA_SNAPSHOTS_DIR:-/var/lib/signal/snapshots}
      RESEARCH_RUNNER_BACKEND: ${RESEARCH_RUNNER_BACKEND:-stub}
      RESEARCH_ALPHAAGENT_IMAGE: ${RESEARCH_ALPHAAGENT_IMAGE:-signal-alphaagent:stub}
      RESEARCH_RDAGENT_IMAGE: ${RESEARCH_RDAGENT_IMAGE:-signal-rdagent:stub}
      WATCHLIST: ${WATCHLIST:-}
      NOTIFY_ENABLED: ${NOTIFY_ENABLED:-false}
      NOTIFY_CHANNELS: ${NOTIFY_CHANNELS:-email,feishu}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TO: ${SMTP_TO:-}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-true}
      FEISHU_WEBHOOK_URL: ${FEISHU_WEBHOOK_URL:-}
      # 容器内默认 stub;真 miniQMT 见 docs/deploy-windows.md(host API)
      LIVE_BROKER: ${LIVE_BROKER:-stub}
      LIVE_MINIQMT_ACCOUNT: ${LIVE_MINIQMT_ACCOUNT:-}
      LIVE_MINIQMT_PATH: ${LIVE_MINIQMT_PATH:-}
    volumes:
      - artifacts:/var/lib/signal/artifacts
      - snapshots:/var/lib/signal/snapshots
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        API_INTERNAL_URL: http://api:8000
    image: signal-web:${SIGNAL_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    networks:
      - internal

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    environment:
      SIGNAL_SITE_ADDRESS: ${SIGNAL_SITE_ADDRESS:-:80}
      CADDY_BASIC_AUTH_USER: ${CADDY_BASIC_AUTH_USER:?set CADDY_BASIC_AUTH_USER}
      CADDY_BASIC_AUTH_HASH: ${CADDY_BASIC_AUTH_HASH:?set CADDY_BASIC_AUTH_HASH}
      CADDY_ACME_EMAIL: ${CADDY_ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api
    networks:
      - internal

  backup:
    build:
      context: .
      dockerfile: Dockerfile.backup
    image: signal-backup:${SIGNAL_IMAGE_TAG:-latest}
    restart: unless-stopped
    profiles: ["backup"]
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-signal}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-signal}
      BACKUP_DIR: /var/backups/signal
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
      BACKUP_S3_URI: ${BACKUP_S3_URI:-}
      BACKUP_INTERVAL_SEC: ${BACKUP_INTERVAL_SEC:-86400}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-auto}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
    volumes:
      - backup_data:/var/backups/signal
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  dbdata:
  artifacts:
  snapshots:
  caddy_data:
  caddy_config:
  backup_data:
