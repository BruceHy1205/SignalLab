# Windows Docker Desktop 覆盖层(优先 Docker 部署)
# 用法:
#   docker compose -f deploy/docker-compose.prod.yml \
#     -f deploy/docker-compose.windows.yml \
#     --env-file .env.prod up -d --build
#
# 说明:
# - 与 Linux 共用同一套镜像/业务代码
# - 注入 live/notify 环境变量;默认 LIVE_BROKER=stub(容器内无法连 miniQMT)
# - 额外暴露 api:8000 便于本机调试

services:
  api:
    environment:
      NOTIFY_ENABLED: ${NOTIFY_ENABLED:-false}
      NOTIFY_CHANNELS: ${NOTIFY_CHANNELS:-email,feishu}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TO: ${SMTP_TO:-}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-true}
      FEISHU_WEBHOOK_URL: ${FEISHU_WEBHOOK_URL:-}
      LIVE_BROKER: ${LIVE_BROKER:-stub}
      LIVE_MINIQMT_ACCOUNT: ${LIVE_MINIQMT_ACCOUNT:-}
      LIVE_MINIQMT_PATH: ${LIVE_MINIQMT_PATH:-}
      RESEARCH_RUNNER_BACKEND: ${RESEARCH_RUNNER_BACKEND:-stub}
      RESEARCH_ALPHAAGENT_IMAGE: ${RESEARCH_ALPHAAGENT_IMAGE:-signal-alphaagent:stub}
      RESEARCH_RDAGENT_IMAGE: ${RESEARCH_RDAGENT_IMAGE:-signal-rdagent:stub}
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  web:
    extra_hosts:
      - "host.docker.internal:host-gateway"

  caddy:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Windows 上部分环境绑定 80 需管理员;可用 CADDY_HTTP_PORT=8080
