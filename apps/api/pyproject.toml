[project]
name = "signal-api"
version = "0.1.0"
description = "FastAPI 组装层:唯一允许 import 所有业务包的地方"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "apscheduler>=3.10,<4",
    "pydantic-settings>=2.6",
    "signal-contracts",
    "signal-datahub",
    "signal-tracker",
    "signal-papertrade",
    "signal-agents",
    "signal-research",
    "signal-notify",
    "signal-live",
]

[tool.uv.sources]
signal-contracts = { workspace = true }
signal-datahub = { workspace = true }
signal-tracker = { workspace = true }
signal-papertrade = { workspace = true }
signal-agents = { workspace = true }
signal-research = { workspace = true }
signal-notify = { workspace = true }
signal-live = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/signal_api"]
