[project]
name = "signal-workspace"
version = "0.1.0"
description = "个人投资研究平台 monorepo 根(uv workspace)"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = ["apps/api", "packages/*"]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "import-linter>=2",
    "pyright>=1.1.390",
    "httpx>=0.27",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001"]  # 中文全角标点是业务文本的一部分

[tool.ruff.lint.per-file-ignores]
# FastAPI 的 Depends 默认参数是框架惯用法
"apps/api/src/signal_api/routes/*" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["packages", "apps"]
asyncio_mode = "auto"

[tool.pyright]
include = ["packages", "apps"]
typeCheckingMode = "standard"
reportMissingTypeStubs = false

# ---- 架构守护:组件间低耦合由 import-linter 在 CI 强制 ----
# 规则(见 docs/architecture.md §1.3):
#   1. contracts 不依赖任何业务包;
#   2. 业务包(datahub、未来的 tracker/papertrade/agents/research)互相独立;
#   3. 业务包不得反向依赖 apps/api(组装层)。
[tool.importlinter]
root_packages = [
    "signal_contracts",
    "signal_datahub",
    "signal_tracker",
    "signal_papertrade",
    "signal_agents",
    "signal_research",
    "signal_notify",
    "signal_live",
    "signal_api",
]

[[tool.importlinter.contracts]]
name = "contracts 是独立底座"
type = "forbidden"
source_modules = ["signal_contracts"]
forbidden_modules = [
    "signal_datahub",
    "signal_tracker",
    "signal_papertrade",
    "signal_agents",
    "signal_research",
    "signal_notify",
    "signal_live",
    "signal_api",
]

[[tool.importlinter.contracts]]
name = "业务包互相独立"
type = "independence"
modules = [
    "signal_datahub",
    "signal_tracker",
    "signal_papertrade",
    "signal_agents",
    "signal_research",
    "signal_notify",
    "signal_live",
]

[[tool.importlinter.contracts]]
name = "业务包不依赖组装层"
type = "forbidden"
source_modules = [
    "signal_datahub",
    "signal_tracker",
    "signal_papertrade",
    "signal_agents",
    "signal_research",
    "signal_notify",
    "signal_live",
    "signal_contracts",
]
forbidden_modules = ["signal_api"]
