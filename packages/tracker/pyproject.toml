[project]
name = "signal-tracker"
version = "0.1.0"
description = "机构推荐胜率追踪:聊天记录抽取、event study、机构画像"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "pandas>=2.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "openai>=1.50",
    "tenacity>=9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/signal_tracker"]
