[project]
name = "signal-research"
version = "0.1.0"
description = "研究任务管理:job CRUD、local/remote 供给、事件接收、策略包校验入库"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "pandas>=2.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "paramiko>=3.4",
    "signal-contracts",
]

[tool.uv.sources]
signal-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/signal_research"]
