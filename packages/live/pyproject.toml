[project]
name = "signal-live"
version = "0.1.0"
description = "实盘意图队列 + broker 端口(miniqmt/stub);默认人工确认"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/signal_live"]
