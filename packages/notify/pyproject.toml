[project]
name = "signal-notify"
version = "0.1.0"
description = "通知渠道:邮件 SMTP + 飞书机器人 webhook"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/signal_notify"]
