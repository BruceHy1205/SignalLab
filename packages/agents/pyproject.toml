[project]
name = "signal-agents"
version = "0.1.0"
description = "多智能体决策层:LangGraph 编排、工具注入、候选池、决策报告"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "pandas>=2.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "openai>=1.50",
    "tenacity>=9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/signal_agents"]
