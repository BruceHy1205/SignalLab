[project]
name = "signal-datahub"
version = "0.1.0"
description = "数据服务:行情适配器(AKShare 主/Tushare 备)、入库缓存、同步任务"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "pandas>=2.2",
    "akshare>=1.15",
    "tushare>=1.4",
    "tenacity>=9",
    "pydantic-settings>=2.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/signal_datahub"]
