[project]
name = "signal-contracts"
version = "0.1.0"
description = "全系统唯一共享包:策略包/研究任务/回报协议三份契约的 pydantic 定义"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/signal_contracts"]
