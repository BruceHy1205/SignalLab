[project]
name = "signal-papertrade"
version = "0.1.0"
description = "模拟盘:虚拟账户、次日开盘撮合、每日结算、净值曲线"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "pandas>=2.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/signal_papertrade"]
